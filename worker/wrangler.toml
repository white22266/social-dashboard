# Password-protected trigger for the dashboard's Refresh button.
# Secret (set with `npx wrangler secret put REFRESH_PASSWORD`, never committed):
#   REFRESH_PASSWORD  the password typed on the website
name = "social-dashboard-refresh"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://dashboard.angiefoong.com,http://localhost:5173,http://localhost:5178"

# failed-attempt counters, the refresh cooldown and the pending request picked up by the Mac
[[kv_namespaces]]
binding = "GUARD"
id = "dc264695325e49eebed9270e781a5b99"
